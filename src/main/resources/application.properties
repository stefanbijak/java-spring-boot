# Naziv aplikacije
spring.application.name=nodex

# MySQL konekcija (dodati parametri za vremensku zonu i UTF-8)
spring.datasource.url=jdbc:mysql://localhost:3306/nodex?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=nodex
spring.datasource.password=nodex1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate podešavanja
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true